plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.0.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.eni'
version = '0.0.1-SNAPSHOT'
description = 'bookhub'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.8'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // Fournit @WebMvcTest : depuis Spring Boot 4, les slices de test sont des modules séparés
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    // Intègre Spring Security à MockMvc : sans ce module, @WithMockUser reste sans effet
    testImplementation 'org.springframework.boot:spring-boot-security-test'
    // Fournit @ServiceConnection : Spring configure la datasource depuis le conteneur Docker
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.4'
    testImplementation 'org.testcontainers:mssqlserver:1.20.4'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ── Tests ──────────────────────────────────────────────────────────────────────
// Deux tâches distinctes, séparées par le tag JUnit "integration" :
//   ./gradlew test            → tests unitaires seuls, rapides, sans Docker
//   ./gradlew integrationTest → tests d'intégration, nécessitent Docker

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'integration'
    }
    exclude '**/BookhubApplicationTests.class'
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.register('integrationTest', Test) {
    description = 'Tests d\'intégration avec SQL Server (Testcontainers)'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration'
    }
    shouldRunAfter tasks.named('test')
}

tasks.withType(Test).configureEach {
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

// ── Couverture de code (JaCoCo) ────────────────────────────────────────────────
// Les classes sans logique métier (entités, DTO, config, exceptions) sont exclues
// du calcul : les inclure gonflerait artificiellement le pourcentage.

def coverageExclusions = [
        'com/eni/bookhub/BookhubApplication.class',
        'com/eni/bookhub/entity/**',
        'com/eni/bookhub/dto/**',
        'com/eni/bookhub/config/**',
        'com/eni/bookhub/exception/**'
]

jacoco {
    toolVersion = '0.8.12'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
    classDirectories.setFrom(
            files(classDirectories.files.collect {
                fileTree(dir: it, exclude: coverageExclusions)
            })
    )
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('jacocoTestReport')
    violationRules {
        rule {
            element = 'PACKAGE'
            includes = ['com.eni.bookhub.service', 'com.eni.bookhub.mapper']
            limit {
                counter = 'INSTRUCTION'
                minimum = 0.70
            }
        }
    }
    classDirectories.setFrom(
            files(classDirectories.files.collect {
                fileTree(dir: it, exclude: coverageExclusions)
            })
    )
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}
